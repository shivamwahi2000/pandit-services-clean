services:
  - type: web
    name: pandit-services-clean
    env: node
    buildCommand: |
      # Install system dependencies for Python packages
      apt-get update && apt-get install -y python3-dev python3-pip
      # Install Python dependencies
      pip3 install --user jhora swisseph
      # Install Node dependencies and build
      npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PYTHON_VERSION
        value: 3.9
      - key: PATH
        value: $PATH:/opt/render/.local/bin
    autoDeploy: true
    repo: https://github.com/shivamwahi2000/pandit-services-clean.git
    branch: main